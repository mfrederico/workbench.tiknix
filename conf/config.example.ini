[app]
baseurl = "https://workbench.tiknix.com"
session_name = "WORKBENCH_SESSION"

[database]
type = "sqlite"
path = "data/workbench.db"

[sidecar]
name       = "workbench"
feature    = "workbench"
landing    = "/workbench"
embedded   = true      ; opened directly, a page goes back through core (the shell + this browser's project)
core_root  = "/var/www/html/default/tiknix"
core_url   = "https://tiknix.com"
sso_secret = ""
